kind: context-manifest
version: 1
id: tei-p5-issue-decision
purpose: Trace a TEI issue, pull request or governance discussion to its actual decision and released effect.
token_budget: 12000
parameters:
  required:
    - repository
    - number_or_identifier
  optional:
    - as_of
read_in_order:
  - knowledge/index.md
  - knowledge/state.md
  - knowledge/specification.md
  - contexts/START.md
  - workflows/trace-issue-decision.md
retrieve:
  - exact issue or pull-request representation and distillate
  - linked discussions, pull requests and commits
  - release notes, ODD, schema or Guidelines evidence for the outcome
  - assertions already synthesizing the decision
expand_when:
  - condition: Closed state has no explicit outcome.
    action: Inspect linked changes and normative release material; report unknown if none establishes it.
  - condition: Current status is part of the answer.
    action: Require a dated snapshot or perform an authorized refresh before claiming current state.
exclude_by_default:
  - unrelated comments by the same participants
  - model-memory descriptions of repository state
grounding_policy: Discussions establish proposals and speech acts; released normative behavior requires released normative evidence.
