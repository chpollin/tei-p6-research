kind: context-manifest
version: 1
id: tei-p5-release-comparison
purpose: Compare two pinned TEI P5 releases while separating file diffs, model changes, rationale and compatibility effects.
token_budget: 16000
parameters:
  required:
    - release_a
    - release_b
read_in_order:
  - knowledge/index.md
  - knowledge/state.md
  - knowledge/specification.md
  - contexts/START.md
  - workflows/compare-releases.md
retrieve:
  - source records and immutable representations for both releases
  - release notes and ODD or schema material for the requested scope
  - existing assertions about changed components
  - linked decision traces only for rationale claims
expand_when:
  - condition: The diff changes validation or migration behavior.
    action: Retrieve a minimal example and validation evidence for both releases.
  - condition: Rationale is requested but release material is silent.
    action: Use contexts/manifests/issue-decision.yml and keep rationale unknown unless supported.
exclude_by_default:
  - repositories or branches outside the declared release scope
  - unchanged modules
grounding_policy: A textual or schema diff proves a difference, not its motive or practical impact.
