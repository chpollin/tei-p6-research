kind: context-manifest
version: 1
id: replace-with-stable-id
purpose: Replace with one bounded retrieval purpose.
token_budget: 8000
parameters:
  required: []
  optional: []
read_in_order:
  - knowledge/index.md
  - knowledge/state.md
  - knowledge/specification.md
  - contexts/START.md
retrieve:
  - replace with narrow canonical retrieval instructions
expand_when:
  - condition: Replace with an observable insufficiency.
    action: Replace with the smallest additional retrieval step.
exclude_by_default:
  - corpus/**
  - 00_sources/**
grounding_policy: Context output is navigation only; cite the canonical Grounded Vault chain.
