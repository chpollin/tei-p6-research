name: checks

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest ruff
      - name: Lint with the configured rule set
        run: python -m ruff check .
      - name: Validate the vault
        run: python tools/validate.py .
      - name: Validate the corpus control plane
        run: python -m tools.corpus.validate_control_plane .
      - name: Check current first-wave source-support review
        run: python tools/check_wave1_sources.py . --review-only
      - name: Reproduce Abstract Text Model 0.1
        run: python tools/check_abstract_text_v01.py --check
      - name: Reproduce editorial cases and current source review
        run: |
          python tools/ingest_editorial_cases.py --check
          python tools/check_editorial_cases.py --check
      - name: Run the test suite
        run: python -m pytest tests -q
      - name: Check the bounded text identity and annotation pilot
        run: python tools/check_text_identity_pilot.py
