name: checks

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked
      - name: Lint with the configured rule set
        run: uv run --locked python -m ruff check .
      - name: Validate the vault
        run: uv run --locked python tools/validate.py .
      - name: Validate the corpus control plane
        run: uv run --locked python -m tools.corpus.validate_control_plane .
      - name: Reconcile the complete Guidelines reference and processing coverage
        run: uv run --locked python -m tools.ingest_guidelines --check
      - name: Reproduce Guidelines navigation and text structures admission
        run: |
          uv run --locked python -m tools.build_guidelines_navigation --check
          uv run --locked python -m tools.ingest_text_structures --check
      - name: Export and verify all admitted Guidelines XML
        run: |
          uv run --locked python -m tools.export_guidelines --output "${RUNNER_TEMP}/guidelines-xml"
          uv run --locked python -m tools.export_guidelines --output "${RUNNER_TEMP}/guidelines-xml" --check
      - name: Check current first-wave source-support review
        run: uv run --locked python tools/check_wave1_sources.py . --review-only
      - name: Reproduce Abstract Text Model 0.1
        run: uv run --locked python tools/check_abstract_text_v01.py --check
      - name: Reproduce entity extension 0.2
        run: uv run --locked python tools/check_entities_v02.py --check
      - name: Reproduce editorial cases and current source review
        run: |
          uv run --locked python tools/ingest_editorial_cases.py --check
          uv run --locked python tools/check_editorial_cases.py --check
      - name: Run the test suite
        run: uv run --locked python -m pytest tests -q
      - name: Check the bounded text identity and annotation pilot
        run: uv run --locked python tools/check_text_identity_pilot.py
