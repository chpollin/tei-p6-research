name: publish-research-workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Validate research data and frontend
        run: |
          python tools/validate.py .
          python -m pytest tests/test_build_corpus_overview.py tests/test_build_docs.py tests/test_pages_workflow.py -q
      - name: Generate the public static site
        run: |
          BUILD_DATE="$(date -u +%F)"
          REPOSITORY_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/"
          python tools/build_docs.py --date "${BUILD_DATE}"
          python tools/build_corpus_overview.py --date "${BUILD_DATE}" --repository-base "${REPOSITORY_BASE}"
          mkdir -p _site
          cp -R docs/. _site/
          cp docs/index.html _site/project.html
          cp docs/corpus.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
