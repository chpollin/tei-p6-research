name: publish-research-workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Validate research data and frontend
        run: |
          python tools/validate.py .
          python -m tools.corpus.validate_control_plane .
          python -m tools.ingest_guidelines --check
          python -m pytest tests -q
      - name: Generate the public static site
        run: |
          BUILD_DATE="$(date -u +%F)"
          REPOSITORY_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/"
          python tools/build_docs.py --date "${BUILD_DATE}" --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --repository-revision "${GITHUB_SHA}"
          python tools/build_corpus_overview.py --date "${BUILD_DATE}" --repository-base "${REPOSITORY_BASE}"
          python tools/build_home.py --date "${BUILD_DATE}" --repository-base "${REPOSITORY_BASE}"
          python tools/build_knowledge.py --date "${BUILD_DATE}" --repository-base "${REPOSITORY_BASE}"
          python tools/build_model_reference.py --date "${BUILD_DATE}" --repository-base "${REPOSITORY_BASE}"
          mkdir -p _site
          cp -R docs/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # One deployment at a time; a running production deployment is never cancelled.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
