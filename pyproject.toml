[project]
name = "tei-p6-research"
version = "0"
requires-python = ">=3.11"
dependencies = ["pyyaml"]
# no [build-system]: this repo is a dependency set for the validation scripts,
# not an installable package

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501 line length; RUF00x deliberate typographic characters
