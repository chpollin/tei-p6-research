  quotes:
  - text: A shared understanding of what P6 means.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Objectives
  - text: We aren't breaking from XML but the abstract model we develop will make alternative serializations (RDF, graph models) possible.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Engage the TEI community
  - text: Our main goal is to formalize the abstract model.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Continued support of P5 while developing P6, question on parallel serializations alongside XML
  - text: Create Sandbox repository
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Establish a workspace
  - text: Council decides to make the repo private for now and reevaluate at F2F at Vancouver.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Establish a workspace
  - text: Toy sandbox research phase for now.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Continued support of P5 while developing P6, question where and how P6 is being developed
  - text: We will REDUCE the number elements in P6.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Continued support of P5 while developing P6, question on the number of elements
  - text: Announce at Annual Members' Meeting that we're stopping new features until we start P6.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Continued support of P5 while developing P6
  - text: We will begin hosting two meetings per month to support P6 development now while continuing work requested on P5.
    locator: TEI Technical Council F2F Meeting in Würzburg, 10–13 March 2026, Friday 3/13, Planning our next steps, Continued support of P5 while developing P6, question where and how P6 is being developed
