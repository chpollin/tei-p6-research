  quotes:
  - text: P6 should separate concept from serialization.
    locator: TEI Technical Council P6 Teleconference, 2026-07-16, review of the Council's main points of agreement about P6 so far
  - text: XML stays the primary format, but the abstract model should be expressible in graph forms (e.g. JSONLD)
    locator: TEI Technical Council P6 Teleconference, 2026-07-16, review of the Council's main points of agreement about P6 so far
  - text: 'P6 should provide a layered architecture: abstract model -> blueprints -> customizations (or chained blueprints)'
    locator: TEI Technical Council P6 Teleconference, 2026-07-16, review of the Council's main points of agreement about P6 so far
  - text: ODD processing must be replaced or radically simplified; above all, it must be clearly specified.
    locator: TEI Technical Council P6 Teleconference, 2026-07-16, review of the Council's main points of agreement about P6 so far
  - text: Review of Council's main points of disagreement about P6 so far
    locator: TEI Technical Council P6 Teleconference, 2026-07-16, section heading
  - text: Whether P5 can be expressed entirely in P6 (as opposed to a P5 schema can be created from scratch using P6 specification mechanisms)
