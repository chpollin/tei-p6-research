known_limits:
- Purposive contrast sample of three community-published customizations reused by
  many projects; no single-project local ODD, no statistical representativeness and
  no family completeness.
- No catalogue case was examined; CMIF is a correspondence metadata interchange profile
  and is not treated as a catalogue.
- 'No ODD compilation, RELAX NG or Schematron validation was executed: TEI Stylesheets,
  Java, Jing, SchXslt and lxml are absent from the project environment. Validity of
  the three input documents is unknown.'
- Observed pipeline configuration (build script, workflows, service code) is source
  text. This run executed only fetching, hashing, XML well-formedness parsing, a deterministic
  element inventory and byte comparisons.
- Schema locations named by the input documents were not fetched; the schema a processor
  applies to them at a given date is not established.
- Release assets, project websites, Docker images and the TEI Stylesheets submodule
  were not acquired.
- Workflow files of repositories without a repository-wide license are local context
  observations only.
- The EpiDoc ODD header states GPL-2.0-or-later while schema/LICENSE.txt states GPL-3.0-or-later;
  both are recorded without legal determination.
- Pinned states are development heads of 2026-09-11 except CMIF, whose head equals
  tag v1.1.0.
- Domain acceptance by drama, epigraphy and correspondence-edition experts has not
  taken place.
